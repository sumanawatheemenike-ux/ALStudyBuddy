name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare project
        shell: bash
        run: |
          set -e

          echo "Checking repository..."

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "Android project found in repository root."
            echo "BUILD_DIR=." >> "$GITHUB_ENV"
          elif [ -f "ALStudyBuddy.zip" ]; then
            echo "ZIP found. Extracting..."

            rm -rf proj
            mkdir -p proj

            unzip -q "ALStudyBuddy.zip" -d proj

            echo "Extracted files:"
            find proj -maxdepth 3 -type f | head -100

            if [ -f "proj/ALStudyBuddy/settings.gradle.kts" ] || [ -f "proj/ALStudyBuddy/settings.gradle" ]; then
              echo "BUILD_DIR=proj/ALStudyBuddy" >> "$GITHUB_ENV"
            elif [ -f "proj/settings.gradle.kts" ] || [ -f "proj/settings.gradle" ]; then
              echo "BUILD_DIR=proj" >> "$GITHUB_ENV"
            else
              echo "ERROR: Could not find settings.gradle or settings.gradle.kts"
              exit 1
            fi
          else
            echo "ERROR: No Android project or ALStudyBuddy.zip found."
            exit 1
          fi

      - name: Make Gradle executable
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build APK
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALStudyBuddy-debug-apk
          path: |
            ${{ env.BUILD_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
